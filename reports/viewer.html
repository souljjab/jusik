<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 보고서함</title>
<style>
:root{--bg:#f7f7f9;--panel:#fff;--text:#1d1d22;--muted:#6b6b76;--line:#e3e3e8;--accent:#5b4bdb;--hl:#ffe58a}
@media (prefers-color-scheme:dark){:root{--bg:#141418;--panel:#1d1d23;--text:#e8e8ee;--muted:#9a9aa6;--line:#2e2e36;--accent:#9d91ff;--hl:#6b5a00}}
:root.dark{--bg:#141418;--panel:#1d1d23;--text:#e8e8ee;--muted:#9a9aa6;--line:#2e2e36;--accent:#9d91ff;--hl:#6b5a00}
:root.light{--bg:#f7f7f9;--panel:#fff;--text:#1d1d22;--muted:#6b6b76;--line:#e3e3e8;--accent:#5b4bdb;--hl:#ffe58a}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);font-size:16px}
header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0 8px 0 0;white-space:nowrap;cursor:pointer}
#q{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:15px}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:8px 10px;cursor:pointer}
#menu{display:none}
.wrap{display:flex;height:calc(100vh - 57px)}
nav{width:320px;flex:none;overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:8px 0}
main{flex:1;overflow:auto;padding:20px 28px 80px}
.rep{padding:10px 14px;cursor:pointer;border-left:3px solid transparent}
.rep:hover{background:var(--bg)}
.rep.on{border-left-color:var(--accent);background:var(--bg)}
.rep b{display:block;font-size:15px}
.rep small{color:var(--muted)}
.toc a{display:block;padding:5px 14px;color:var(--text);text-decoration:none;font-size:14px}
.toc a:hover{color:var(--accent)}
.toc a.l2{padding-left:30px;color:var(--muted)}
.toc a.l3{padding-left:46px;color:var(--muted);font-size:13px}
h2.rt{margin:0 0 4px;font-size:24px}
.sub{color:var(--muted);margin-bottom:20px;font-size:14px}
section{margin-bottom:28px;scroll-margin-top:10px}
section h3{font-size:19px;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
section h3.l2{font-size:17px;border:0}
section h3.l3{font-size:15px;border:0}
pre{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-family:inherit;line-height:1.7;margin:0;font-size:15px}
mark{background:var(--hl);color:inherit;border-radius:2px}
.hit{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:10px;cursor:pointer}
.hit:hover{border-color:var(--accent)}
.hit .w{font-size:13px;color:var(--muted)}
.hit .t{font-weight:600;margin:2px 0 6px}
.hit .s{font-size:14px;line-height:1.6;color:var(--muted)}
.card{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:12px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card .tag{display:inline-block;font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 8px;margin-bottom:6px}
#top{position:fixed;right:18px;bottom:18px;display:none}
@media (max-width:820px){
  #menu{display:block}
  nav{position:fixed;top:57px;left:0;bottom:0;z-index:4;transform:translateX(-100%);transition:transform .2s;width:85vw;max-width:340px}
  nav.open{transform:none;box-shadow:0 0 30px rgba(0,0,0,.3)}
  main{padding:16px 16px 80px}
  header h1{font-size:15px}
}
@media print{header,nav,#top{display:none}.wrap{height:auto;display:block}main{overflow:visible}}
</style>
</head>
<body>
<header>
  <button id="menu" aria-label="목차">☰</button>
  <h1 id="home">📚 내 보고서함</h1>
  <input id="q" type="search" placeholder="모든 보고서에서 검색 (예: 손절, 근거 스트립)" autocomplete="off">
  <button id="theme" title="밝게/어둡게">◐</button>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<button id="top">↑ 맨 위</button>
<script>
const REPORTS = /*__DATA__*/null;
const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const main = $('#main'), nav = $('#nav'), q = $('#q');
let current = null;

function terms() { return q.value.trim().toLowerCase().split(/\s+/).filter(Boolean); }
function highlight(text, ts) {
  let h = esc(text);
  if (!ts.length) return h;
  const re = new RegExp('(' + ts.map((t) => esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  return h.replace(re, '<mark>$1</mark>');
}

function renderNav() {
  nav.innerHTML = REPORTS.map((r) => {
    const on = current && current.id === r.id;
    const toc = on ? '<div class="toc">' + r.sections.map((s, i) =>
      `<a class="l${Math.min(s.level, 3)}" href="#${r.id}/${i}">${esc(s.title)}</a>`).join('') + '</div>' : '';
    return `<div class="rep${on ? ' on' : ''}" data-id="${r.id}"><b>${esc(r.name)}</b><small>${esc(r.tag)}${r.date ? ' · ' + r.date : ''} · ${r.sections.length}개 절</small></div>${toc}`;
  }).join('');
}

function showHome() {
  current = null;
  main.innerHTML = '<h2 class="rt">내 보고서</h2><div class="sub">보고서 ' + REPORTS.length + '건 · 위 검색창에 단어를 넣으면 모든 보고서에서 바로 찾아요.</div>' +
    REPORTS.map((r) => `<div class="card" data-id="${r.id}"><span class="tag">${esc(r.tag)}</span><h3 style="margin:0 0 4px">${esc(r.name)}</h3><div class="sub" style="margin:0">${r.date ? esc(r.date) + ' · ' : ''}${r.sections.length}개 절 · 약 ${Math.round(r.chars / 1000)}천 자</div></div>`).join('');
  renderNav();
}

function showReport(id, idx) {
  const r = REPORTS.find((x) => x.id === id);
  if (!r) return showHome();
  const ts = terms();
  if (!current || current.id !== id || main.dataset.terms !== ts.join(' ')) {
    current = r;
    main.dataset.terms = ts.join(' ');
    main.innerHTML = `<h2 class="rt">${esc(r.name)}</h2><div class="sub">${esc(r.tag)}${r.date ? ' · ' + r.date : ''} · 원본 docs/${esc(r.file)}</div>` +
      r.sections.map((s, i) => `<section id="s-${i}"><h3 class="l${Math.min(s.level, 3)}">${highlight(s.title, ts)}</h3><pre>${highlight(s.body, ts)}</pre></section>`).join('');
    renderNav();
  }
  const el = idx != null ? document.getElementById('s-' + idx) : null;
  if (el) { el.scrollIntoView(); const m = el.querySelector('mark'); if (m) m.scrollIntoView({ block: 'center' }); }
  else main.scrollTop = 0;
  localStorage.setItem('last', location.hash);
}

function search() {
  const ts = terms();
  if (!ts.length) return route();
  const hits = [];
  for (const r of REPORTS) r.sections.forEach((s, i) => {
    const hay = (s.title + '\n' + s.body).toLowerCase();
    if (ts.every((t) => hay.includes(t))) {
      const pos = Math.max(0, hay.indexOf(ts[0]) - 60);
      const snip = (s.title + '\n' + s.body).slice(pos, pos + 200).replace(/\s+/g, ' ');
      const score = ts.reduce((n, t) => n + hay.split(t).length - 1 + (s.title.toLowerCase().includes(t) ? 20 : 0), 0);
      hits.push({ r, s, i, snip, score });
    }
  });
  hits.sort((a, b) => b.score - a.score);
  current = null; renderNav();
  main.innerHTML = `<h2 class="rt">“${esc(q.value.trim())}” 검색 결과</h2><div class="sub">${hits.length}곳에서 찾았어요.</div>` +
    (hits.length ? hits.slice(0, 200).map((h) => `<div class="hit" data-go="#${h.r.id}/${h.i}"><div class="w">${esc(h.r.name)}</div><div class="t">${highlight(h.s.title, ts)}</div><div class="s">…${highlight(h.snip, ts)}…</div></div>`).join('') : '<p>찾는 단어가 없어요. 다른 단어로 찾아보세요.</p>');
  main.scrollTop = 0;
}

function route() {
  const m = location.hash.match(/^#([\w-]+)(?:\/(\d+))?/);
  if (m) showReport(m[1], m[2] != null ? +m[2] : null); else showHome();
  nav.classList.remove('open');
}

let timer;
q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 150); });
q.addEventListener('keydown', (e) => { if (e.key === 'Escape') { q.value = ''; route(); } });
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-id],[data-go]');
  if (!t) return;
  const target = t.dataset.go || '#' + t.dataset.id;
  if (location.hash === target) route(); else location.hash = target;
});
document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'f') { e.preventDefault(); q.focus(); q.select(); } });
$('#home').onclick = () => { q.value = ''; location.hash = ''; showHome(); };
$('#menu').onclick = () => nav.classList.toggle('open');
$('#top').onclick = () => { main.scrollTop = 0; };
main.addEventListener('scroll', () => { $('#top').style.display = main.scrollTop > 600 ? 'block' : 'none'; });
const root = document.documentElement;
const applyTheme = () => { root.classList.remove('dark', 'light'); const t = localStorage.getItem('theme'); if (t) root.classList.add(t); };
$('#theme').onclick = () => {
  const dark = root.classList.contains('dark') || (!root.classList.contains('light') && matchMedia('(prefers-color-scheme: dark)').matches);
  localStorage.setItem('theme', dark ? 'light' : 'dark'); applyTheme();
};
window.addEventListener('hashchange', route);
applyTheme();
if (!location.hash && localStorage.getItem('last')) location.hash = localStorage.getItem('last');
route();
</script>
</body>
</html>
